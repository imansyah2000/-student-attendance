<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Attendance System</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin: 0;
    padding: 20px;
    text-align: center;
    color: #142b50;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

h1 {
    color: #102c55;
}

#reader {
    width: 100%;
    max-width: 400px;
    margin: 20px auto;
}

button {
    background: #123b70;
    color: white;
    border: none;
    padding: 14px 22px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    background: #0756a5;
}

input {
    width: 90%;
    padding: 14px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

#result {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    font-weight: bold;
    display: none;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.warning {
    background: #fef3c7;
    color: #92400e;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}
</style>
</head>

<body>

<div class="container">

    <h1>Student Attendance System</h1>
    <p>QR Code Attendance Scanner</p>

    <div id="reader"></div>

    <button onclick="startScanner()">Start Scanner</button>
    <button onclick="stopScanner()">Stop Scanner</button>

    <hr>

    <h2>Manual Attendance</h2>

    <input
        type="text"
        id="studentID"
        placeholder="Enter Student ID (e.g. STD001)"
    >

    <br>

    <button onclick="manualCheckIn()">Submit Attendance</button>

    <div id="result"></div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyzPbm_l7TNCw9c5OMoTrGMjWxiBLPs3A12YBQ6wz489Nt1B5dtZ-8NfXGbKhNqH2e3Ow/exec";

let scanner = null;
let scanning = false;
let processing = false;


// DISPLAY RESULT
function showResult(type, message) {

    const result = document.getElementById("result");

    result.className = type;
    result.innerHTML = message;
    result.style.display = "block";

}


// SEND ATTENDANCE TO GOOGLE SHEETS
function sendAttendance(studentID) {

    if (!studentID || processing) return;

    processing = true;

    showResult("warning", "Processing attendance...");

    const callbackName = "attendanceCallback_" + Date.now();

    const script = document.createElement("script");

    const timeout = setTimeout(() => {

        cleanup();

        showResult("error", "Unable to connect to attendance server.");

        processing = false;

    }, 15000);

    function cleanup() {

        clearTimeout(timeout);

        if (script.parentNode) {
            script.parentNode.removeChild(script);
        }

        delete window[callbackName];

    }

    window[callbackName] = function(response) {

        cleanup();

        if (response.success) {

            showResult(
                "success",
                "ATTENDANCE SUCCESSFUL!<br><br>" +
                "Name: " + response.name + "<br>" +
                "Class: " + response.className
            );

        } else if (
            response.message &&
            response.message.includes("Already Checked In")
        ) {

            showResult("warning", response.message);

        } else {

            showResult("error", response.message);

        }

        setTimeout(() => {

            processing = false;

            if (scanner && scanning) {

                try {
                    scanner.resume();
                } catch(e) {}

            }

        }, 2500);

    };

    script.src =
        API_URL +
        "?action=scan&id=" +
        encodeURIComponent(studentID) +
        "&callback=" +
        callbackName;

    script.onerror = function() {

        cleanup();

        showResult("error", "Unable to connect to attendance server.");

        processing = false;

    };

    document.body.appendChild(script);

}


// START QR SCANNER
async function startScanner() {

    if (scanning) return;

    try {

        scanner = new Html5Qrcode("reader");

        await scanner.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: 220
            },

            (decodedText) => {

                if (processing) return;

                try {
                    scanner.pause(true);
                } catch(e) {}

                sendAttendance(decodedText);

            }
        );

        scanning = true;

    } catch(error) {

        showResult(
            "error",
            "Camera error. Please allow camera permission."
        );

    }

}


// STOP QR SCANNER
async function stopScanner() {

    if (!scanner || !scanning) return;

    try {

        await scanner.stop();

        await scanner.clear();

        scanner = null;

        scanning = false;

    } catch(error) {

        console.log(error);

    }

}


// MANUAL ATTENDANCE
function manualCheckIn() {

    const studentID = document
        .getElementById("studentID")
        .value
        .trim();

    if (!studentID) {

        showResult("error", "Please enter a Student ID.");

        return;

    }

    sendAttendance(studentID);

    document.getElementById("studentID").value = "";

}

</script>

</body>
</html>
